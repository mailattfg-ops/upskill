name: Ping Supabase to Prevent Pausing

on:
  schedule:
    # Runs at 00:00 every 3 days (Supabase free tier projects pause after 7 days of inactivity)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab in GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Error: NEXT_PUBLIC_SUPABASE_URL or NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY secret is not set in GitHub repository secrets."
            exit 1
          fi
          echo "Pinging Supabase REST API..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/site_settings?select=key&limit=1")
          echo "Ping request completed with HTTP status code: $STATUS_CODE"
